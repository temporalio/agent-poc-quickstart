# Use case: AI agents & applications
#
# Build `default_prototype` first, before asking the user anything. Use `goals`
# later, once they describe what they actually want, to pick the patterns that
# fit - taking a pattern only if its `when` holds.
#
# Read referenced patterns in patterns.yaml.

title: AI agents & applications

default_prototype:
  build: >
    A three-stage pipeline: planTopics -> researchTopic x3 in parallel ->
    synthesizeReport. One Workflow, four Activities. Mock the model and search
    calls so they return fixed, plausible text and the run is deterministic and
    free. It completes successfully on the first run.
  patterns: [parallel-execution, activity-dependency-injection]
  shows: >
    Multiple model and tool steps orchestrated in one durable Workflow, with the
    middle stage fanned out in parallel and gathered.

goals:

  coordinate-steps:
    label: Coordinate multiple AI, tool, or agent steps
    patterns:
      - id: parallel-execution
        when: Steps are independent and can run at once, and the total stays well under 2,000 pending Activities
      - id: activity-dependency-injection
        when: Steps call a model or API client that should be built once per Worker and mocked in tests
      - id: pick-first
        when: You want to race two models or providers and take the first result
      - id: child-workflows
        when: A step needs its own Workflow ID, its own history or retry policy, a different Task Queue, or may outlive the parent
    notes: >
      Model and tool calls belong in Activities, not Child Workflows. Tools that
      only mutate agent state and are deterministic can live in the Workflow
      directly. Disable retries in the model client library so Temporal owns
      retry. Typical timeouts - 30s for a simple model call, 300s for a
      reasoning model or web search.

  durable-agent-state:
    label: Keep durable state for an agent, session, or task
    patterns:
      - id: entity-workflow
        when: One long-lived agent, session, or task receives events over time and holds state between them
      - id: signal-with-start
        when: The first event should create the session lazily and needs no response
      - id: request-response-via-updates
        when: The caller needs a validated, typed response rather than fire-and-forget
      - id: continue-as-new
        when: The session runs long enough that history would grow unbounded
    notes: >
      Agent state and Workflow state are the same thing. Conversation history,
      scratchpads, and task lists live in the Workflow, exposed to callers with
      a Query.

  long-tasks-progress:
    label: Run long AI tasks with progress tracking
    patterns:
      - id: long-running-activity
        when: An Activity runs longer than ~30 seconds, or you need progress reporting, cancellation, or resume-from-checkpoint
      - id: retry-metrics
        when: You want on-call alerting on sustained retries without changing retry behavior
      - id: resumable-activity
        when: Retries are exhausted because input data is wrong and a human can correct it
    notes: >
      Heartbeat details are what make a long Activity resumable after a Worker
      crash. Expose progress to callers with a Query.

  retry-flaky-calls:
    label: Retry flaky model, tool, or API calls safely
    patterns:
      - id: non-retryable-errors
        when: The call can never succeed as issued - invalid input, 401, 404, validation failure, content policy
      - id: delayed-retry
        when: The error carries its own delay, such as a 429 Retry-After header
      - id: fixed-count-retries
        when: Each attempt costs money, such as per-token model pricing or a metered API
      - id: fast-slow-retries
        when: You must survive both brief blips and hour-long provider outages
      - id: fixed-wall-time-retries
        when: A business SLA bounds the whole operation
    requires: >
      Any retried call with side effects needs an idempotency key derived from
      the Workflow ID or a business identifier, or a retry duplicates the
      effect.

  parallel-ai-processing:
    label: Process many AI tasks, documents, or prompts in parallel
    patterns:
      - id: parallel-execution
        when: The item count is small and fits inside one Workflow
      - id: fanout-child-workflows
        when: The chunk count is known up front, stays under 1,000, and no rate control is needed
      - id: sliding-window
        when: The set is arbitrarily large or unbounded and concurrency must stay bounded
      - id: mapreduce-tree
        when: Throughput matters most and results need hierarchical aggregation
      - id: batch-iterator
        when: Sequential page-by-page is acceptable and you want a durable checkpoint after every page
    notes: >
      Pass references, not payloads - Activities fetch and write the documents.
      Decide with the user whether a permanently failed item should fail the
      whole set or let it complete with partial results.

  protect-capacity:
    label: Avoid overwhelming model, tool, or downstream API capacity
    patterns:
      - id: downstream-rate-limiting
        when: The provider publishes an explicit requests-per-second limit and only some Activity types need throttling
      - id: sliding-window
        when: The constraint is concurrent in-flight work rather than a rate
      - id: fairness
        when: Multiple tenants or customers share model capacity and large ones must not starve small ones
      - id: priority-task-queues
        when: Interactive requests share capacity with background or batch AI work
